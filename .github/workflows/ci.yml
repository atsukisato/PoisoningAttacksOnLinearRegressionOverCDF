name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libboost-all-dev

      - name: Smoke test
        run: ./scripts/smoke_test.sh
